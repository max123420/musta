name: SudanCare bundle CI
on:
  workflow_dispatch:
  push:
    paths:
      - 'SudanCare-phase5-final.bundle'
      - '.github/workflows/bundle-ci.yml'


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract bundled project
        run: |
          git clone --quiet --branch main "$GITHUB_WORKSPACE/SudanCare-phase5-final.bundle" "$GITHUB_WORKSPACE/sudancare"
          test -f "$GITHUB_WORKSPACE/sudancare/requirements-dev.txt"
          find "$GITHUB_WORKSPACE/sudancare" -maxdepth 1 -type f -print
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: sudancare
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        working-directory: sudancare
        run: python -m compileall -q app scripts tests migrations
      - name: Tests
        working-directory: sudancare
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Black-box E2E smoke
        working-directory: sudancare
        env:
          PYTHONPATH: .
        run: python scripts/e2e_smoke.py
      - name: Security smoke
        working-directory: sudancare
        run: python scripts/security_smoke.py


  migration:
    runs-on: ubuntu-latest
    services:
