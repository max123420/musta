services:
  clinic:
    build: .
    profiles: [clinic]
    ports: ["8080:8080"]
    environment:
      SUDANCARE_MODE: clinic
      SUDANCARE_DB_PATH: /data/sudancare.db
    volumes: ["clinic-data:/data"]
  central:
    build: .
    profiles: [central]
    ports: ["8090:8080"]
    environment:
      SUDANCARE_MODE: central
      SUDANCARE_DB_PATH: /data/sudancare-central.db
    volumes: ["central-data:/data"]
volumes:
  clinic-data:
  central-data:
