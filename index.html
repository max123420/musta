<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SudanCare</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:#163732;font:15px system-ui}.hide{display:none!important}header{background:#087866;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 70px)}nav{background:#fff;border-left:1px solid #dce9e5;padding:12px}nav button{background:transparent;color:#24524a;text-align:right;border:0;width:100%;padding:11px;border-radius:8px;font:inherit;cursor:pointer}nav button:hover,nav button.active{background:#e0f2ed;color:#056b5b;font-weight:700}main{padding:26px;max-width:1200px;width:100%;margin:auto}.card{background:#fff;border:1px solid #dce9e5;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #1232}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.metric{font-size:28px;font-weight:800;color:#087866}input,textarea,select,button{font:inherit;padding:11px;border:1px solid #b8d5ce;border-radius:8px;margin:4px 0;width:100%}button{background:#087866;color:#fff;cursor:pointer;border:0;font-weight:700}.auth{max-width:430px;margin:10vh auto}.muted{color:#57716b}.err{color:#b22b2b}.ok{color:#087866}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:9px;border-bottom:1px solid #e5efec}@media(max-width:720px){.shell{display:block}nav{display:flex;gap:3px;overflow:auto;border:0}nav button{white-space:nowrap;width:auto}main{padding:14px}}
</style></head><body><header><div><b>SudanCare Network</b><small> · شبكة سودان كير</small></div><button id="out" class="hide" onclick="logout()" style="width:auto;background:#fff;color:#087866">خروج</button></header><section id="auth" class="card auth"><h1>تسجيل الدخول</h1><input id="u" placeholder="اسم المستخدم"><input id="p" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><p id="notice"></p><details><summary>إعداد أول مسؤول</summary><input id="su" placeholder="اسم المستخدم"><input id="sp" type="password" placeholder="كلمة مرور 12 حرفًا على الأقل"><button onclick="setup()">إنشاء المسؤول</button></details></section><section id="app" class="hide shell"><nav id="nav"><button onclick="page('dashboard')">لوحة المتابعة</button><button onclick="page('patients')">المرضى</button><button onclick="page('appointments')">المواعيد والطابور</button><button onclick="page('laboratory')">المختبر</button><button onclick="page('radiology')">الأشعة</button><button onclick="page('inventory')">الصيدلية والمخزون</button><button onclick="page('billing')">الفواتير</button><button onclick="page('reports')">التقارير</button><button onclick="page('sync')">المزامنة</button></nav><main><p id="who" class="muted"></p><div id="view"></div></main></section><script>
async function api(url,opt={}){let r=await fetch(url,{headers:{'content-type':'application/json'},...opt}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'تعذر تنفيذ العملية');return d}function note(t,ok=false){notice.textContent=t;notice.className=ok?'ok':'err'}async function setup(){try{await api('/setup',{method:'POST',body:JSON.stringify({username:su.value,password:sp.value})});note('تم الإنشاء. سجل الدخول الآن.',true)}catch(e){note(e.message)}}async function login(){try{await api('/auth/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});await openApp()}catch(e){note(e.message)}}async function logout(){await api('/auth/logout',{method:'POST'});location.reload()}async function openApp(){let me=await api('/auth/me');auth.classList.add('hide');app.classList.remove('hide');out.classList.remove('hide');who.textContent='مرحبًا '+me.username+' · '+me.role;page('dashboard')}function table(rows,cols){return rows.length?'<table><thead><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+String(r[c[1]]??'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<p class="muted">لا توجد سجلات بعد.</p>'}function renderError(e){view.innerHTML='<div class="card err"><h2>تعذر تحميل الصفحة</h2><p>'+e.message+'</p><button onclick="page(currentPage)">إعادة المحاولة</button></div>'}let currentPage='dashboard';async function page(name){currentPage=name;[...nav.children].forEach(x=>x.classList.toggle('active',x.textContent.includes({dashboard:'لوحة',patients:'المرضى',appointments:'المواعيد',laboratory:'المختبر',radiology:'الأشعة',inventory:'الصيدلية',billing:'الفواتير',reports:'التقارير',sync:'المزامنة'}[name])));view.innerHTML='<div class="card muted">جارٍ تحميل الصفحة…</div>';try{if(name==='dashboard'){let s=await api('/reports/summary');view.innerHTML='<h1>لوحة المتابعة</h1><div class="grid">'+[['الزيارات',s.visits],['في الانتظار',s.waiting_patients],['تنبيهات المخزون',s.low_stock_batches],['الإيراد المؤكد',s.verified_revenue_minor]].map(x=>'<div class="card"><div class="metric">'+x[1]+'</div>'+x[0]+'</div>').join('')+'</div>';return}if(name==='patients'){view.innerHTML='<h1>المرضى</h1><div class="card"><input id="na" placeholder="الاسم بالعربية"><input id="ne" placeholder="Name in English"><input id="ph" placeholder="الهاتف"><button onclick="patient()">تسجيل مريض</button><p id="pm"></p></div><div class="card"><input id="q" oninput="search()" placeholder="بحث بالاسم أو الهاتف أو الرقم الطبي"><div id="list"></div></div>';return}let routes={appointments:['/appointments','المواعيد والطابور',[['الطابور','queue_number'],['الحالة','status'],['السبب','reason']]],laboratory:['/lab/orders','المختبر',[['رقم العينة','accession_number'],['الحالة','status'],['النتيجة','result_value']]],radiology:['/radiology/orders','الأشعة',[['النوع','modality'],['المنطقة','body_region'],['الحالة','status']]],inventory:['/inventory/batches','الصيدلية والمخزون',[['الدواء','name_ar'],['رقم الدفعة','batch_no'],['الكمية','quantity'],['الصلاحية','expires_on']]],billing:['/invoices','الفواتير والمدفوعات',[['الحالة','status'],['الإجمالي','total_minor'],['المدفوع المؤكد','verified_paid_minor']]]};if(routes[name]){let r=routes[name],x=await api(r[0]);view.innerHTML='<h1>'+r[1]+'</h1><div class="card">'+table(x,r[2])+'</div>';return}if(name==='reports'){let x=await api('/reports/summary');view.innerHTML='<h1>التقارير</h1><div class="card"><pre>'+JSON.stringify(x,null,2)+'</pre></div>';return}if(name==='sync'){let x=await api('/sync/status');view.innerHTML='<h1>المزامنة</h1><div class="card"><pre>'+JSON.stringify(x,null,2)+'</pre></div>';return}}catch(e){renderError(e)}}async function patient(){try{let x=await api('/patients',{method:'POST',body:JSON.stringify({name_ar:na.value,name_en:ne.value,phone:ph.value})});pm.textContent='تم تسجيل المريض: '+x.mrn;pm.className='ok';search()}catch(e){pm.textContent=e.message;pm.className='err'}}async function search(){try{let x=await api('/patients?q='+encodeURIComponent(q.value));list.innerHTML=table(x,[['الرقم الطبي','mrn'],['الاسم','name_ar'],['الهاتف','phone']])}catch(e){}}openApp().catch(()=>{});
</script></body></html>
